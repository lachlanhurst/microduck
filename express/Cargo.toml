# Expression: the outputs that show how Dukki is (the eye LED in its head), and the daemon that
# decides what they show.
#
# Not part of Pollen's robot. `expressd` follows robotd's state stream for what the body is doing and
# takes requests on its own socket for everything else (mood, identify, the camera indicator).
# The LED is driven by clocking its single-wire protocol out of SPI MOSI — see src/lib.rs.
[package]
name = "express"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lib]
name = "express"

[[bin]]
name = "expressd"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { workspace = true, features = ["derive"] }
duck-ipc-proto = { path = "../duck-ipc-proto" }
libc = "0.2"
serde = { workspace = true }
serde_json.workspace = true
tokio = { workspace = true, features = ["macros", "net", "rt", "signal", "sync", "time", "io-util"] }
tracing.workspace = true
tracing-subscriber = { workspace = true, features = ["env-filter"] }
